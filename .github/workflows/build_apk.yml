name: Compilar Super-App IBPM CR (APK Android)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'

      - name: Instalar Dependências Python & Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet[all]==0.86.5
          pip install -r requirements.txt

      - name: Compilar APK de Produção (Release)
        run: |
          flet build apk --yes --no-rich-output --skip-flutter-doctor --project ibpmcr_app --product "IBPM CR" --org org.ibpmcr --module-name main --android-permissions INTERNET=true ACCESS_NETWORK_STATE=true

      - name: Fazer Upload do APK (.apk) Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: IBPM_CR_SuperApp_Release_APK
          path: |
            build/apk/*.apk
            build/app/outputs/flutter-apk/*.apk
            dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Fazer Upload do APK para o Cloudflare R2 (Download Direto e Desktop)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || 'cb3eb9f7f6b1807b95686ab47343c984' }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'ibpmcr-midia' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || '37295144360fb086a91cba7835208ede' }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || '4e578dc6e225edf9ea9ee64f3e24090deca4a442fce0c0429861633811343a44' }}
        run: |
          pip install boto3
          python -c "
          import os, glob, boto3
          apk_files = glob.glob('build/apk/*.apk') + glob.glob('build/app/outputs/flutter-apk/*.apk') + glob.glob('dist/*.apk')
          if apk_files:
              apk_path = apk_files[0]
              print(f'Enviando {apk_path} para o Cloudflare R2...')
              s3 = boto3.client(
                  's3',
                  endpoint_url=f'https://{os.getenv(\"R2_ACCOUNT_ID\")}.r2.cloudflarestorage.com',
                  aws_access_key_id=os.getenv('R2_ACCESS_KEY_ID'),
                  aws_secret_access_key=os.getenv('R2_SECRET_ACCESS_KEY'),
                  region_name='auto'
              )
              s3.upload_file(apk_path, os.getenv('R2_BUCKET_NAME'), 'app/IBPMCR-App-Oficial.apk', ExtraArgs={'ContentType': 'application/vnd.android.package-archive'})
              print('Upload do APK para o Cloudflare R2 concluído com sucesso!')
          else:
              print('Nenhum arquivo APK encontrado para envio.')
          "

