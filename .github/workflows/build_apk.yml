name: Compilar Super-App IBPM CR (APK Android)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'

      - name: Instalar Dependências Python & Flet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet[all]

      - name: Compilar APK de Produção (Release)
        run: |
          flet build apk --project ibpmcr_app --product "IBPM CR" --org org.ibpmcr --module-name main

      - name: Fazer Upload do APK (.apk) Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: IBPM_CR_SuperApp_Release_APK
          path: build/apk/*.apk
          retention-days: 30
